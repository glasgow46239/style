name: Build style outputs

on:
  push:
    paths: ["tokens.json", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate be.css and be.js
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add be.css be.js
          git diff --cached --quiet || git commit -m "build: regenerate be.css and be.js from tokens.json"
          git push
